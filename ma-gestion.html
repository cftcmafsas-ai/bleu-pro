button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:var(--dk);border:0;border-radius:999px;padding:10px 18px;font-weight:600}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px 14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.tile b{display:block;font-size:28px;font-weight:400}.tile span{font-weight:600}.tile small{display:block;color:var(--mu);font-size:12px;margin-top:2px;line-height:1.3}

.it small{color:var(--mu);display:block}.it>div{min-width:0}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ac2);color:var(--dk);display:grid;place-items:center;font-weight:600;background-size:cover;background-position:center}
.big{width:110px;height:110px;font-size:40px;margin:0 auto 10px}

.tot{background:var(--card);border-radius:18px;padding:12px 14px;margin:10px 0;font-size:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.desc{color:var(--mu);font-size:14px;margin:-6px 0 12px}

function gcal(m,r){const d=r.debut||r.date;if(!d)return "";const p=s=>s.replace(/-/g,"");let st,en;
 if(r.heure){st=p(d)+"T"+r.heure.replace(":","")+"00";const [H,Mi]=r.heure.split(":").map(Number),t=new Date(2000,0,1,H,Mi+({"30 min":30,"1 h":60,"1 h 30":90,"2 h":120}[r.duree]||60));en=p(r.date||d)+"T"+String(t.getHours()).padStart(2,"0")+String(t.getMinutes()).padStart(2,"0")+"00"}
 else{st=p(d);const e=new Date(r.date||d);e.setDate(e.getDate()+1);en=e.toISOString().slice(0,10).replace(/-/g,"")}

function lst(){
 const m=gm(view),L=S("d:"+m.id)||[],f=flt(m,L);

  const meta=m.f.filter(x=>x[2]!=="h"&&x[2]!==P&&x[0]!=="nom"&&x[0]!=="prenom").map(([k,l,t])=>r[k]?(t===N?l+" : "+r[k]:r[k]):"").filter(Boolean).slice(0,3).join(" · ");

function fiche(id,i){
 view="fiche";cur={id,i};const m=gm(id),r=(S("d:"+id)||[])[i];
 let ex="";if(m.paie&&r.brut){const b=+r.brut,c=b*(+r.cotis||0)/100;ex=`<div class="tot">Net à payer : <b>${eur(b-c)}</b><br>Cotisations : ${eur(c)}</div>`}
 let h="",sec="";m.f.filter(x=>x[2]!==P).forEach(([k,l,t])=>{if(t==="h"){sec=`<small style="font-weight:600;display:block;margin-top:10px">${l}</small>`;return}if(r[k]){h+=sec+`<div class="fv"><small>${l}</small>${esc(r[k])}${t==="pct"?" %":""}</div>`;sec=""}});
 app.innerHTML=`<div class="top"><button class="g" onclick="go('${id}')">‹</button><h1>${esc(dn(m,r))}</h1></div>${m.f.some(x=>x[2]===P)?av(r,"big"):""}<div style="text-align:center">${links(m,r)}</div>${ex}<div class="it" style="display:block;margin-top:16px">${h}</div>${PEO.includes(id)?rel(dn(m,r)):""}${m.doc?`<button class="g" onclick="pdf('${id}',${i})" style="width:100%;margin-bottom:10px">📄 Voir / imprimer en PDF</button>`:""}<div class="top"><button onclick="frm('${id}',${i})" style="flex:1">Modifier</button><button class="d" onclick="del('${id}',${i})">Supprimer</button></div>`;

 const m=gm(id),r=i===undefined?{}:(S("d:"+id)||[])[i];pend=r.photo||"";
 const names=people().map(p=>dn(p.m,p.r)).filter(Boolean),TY={[D]:"date",[N]:"number",tm:"time",email:"email",tel:"tel",url:"url"};
 app.innerHTML=`<div class="top"><button class="g" onclick="${i===undefined?`go('${id}')`:`fiche('${id}',${i})`}">‹</button><h1>${i===undefined?"Nouveau":"Modifier"}</h1></div><datalist id="ctc">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`+
 m.f.map(([k,l,t,x])=>{
  if(t==="h")return `<h1 style="font-size:17px;margin:16px 0 4px">${l}</h1>`;
  if(t===P)return `<label>${l}</label><div class="it">${'<div class="av" id="pv"'+(pend?` style="background-image:url(${pend})"`:"")+'>'+(pend?"":"📷")+'</div>'}<input type="file" accept="image/*" onchange="photo(this)" style="margin:0"></div>`;
  const v=esc(r[k]);let c;
  if(t==="sel")c=`<select id="f_${k}"><option value=""></option>${x.map(o=>`<option ${r[k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(t==="area"||k==="note")c=`<textarea id="f_${k}" rows="3">${v}</textarea>`;
  else if(t==="pct")c=`<input id="f_${k}" type="range" min="0" max="100" step="5" value="${+r[k]||0}" oninput="this.nextSibling.textContent=this.value+' %'"><span>${+r[k]||0} %</span>`;

 `<button onclick="save('${id}',${i===undefined?-1:i})" style="width:100%">Enregistrer</button>`;

function photo(el){
 const fl=el.files[0];if(!fl)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,256/Math.min(im.width,im.height)),w=im.width*s,h=im.height*s;

  pend=c.toDataURL("image/jpeg",.75);const p=$("#pv");p.style.backgroundImage=`url(${pend})`;p.textContent=""};im.src=rd.result};rd.readAsDataURL(fl);

function save(id,i){

(S('d:'+m.id)||[]).forEach((r,i)=>{if((r[fk]||'').trim().toLowerCase()===k)h+=`<div class="it" onclick="fiche('${m.id}',${i})"><div class="av" style="width:36px;height:36px">${m.i}</div><div><b>${esc(r.nom)}</b><small>${m.n}${r.montant?' · '+eur(+r.montant):''}${r.date?' · '+esc(r.date):''}</small></div></div>`})});
